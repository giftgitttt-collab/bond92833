<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة خاصة جداً 🔒</title>
    <style>
        body {
            /* خلفية بتدرج ناعم يجمع بين المشمشي والوردي */
            background: linear-gradient(135deg, #FEA38E, #FBA2AB);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .login-box {
            /* صندوق تسجيل الدخول بلون بيج ناعم ودافئ */
            background: #FFDFC3;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(138, 59, 67, 0.25);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 2px solid #F3B5A0;
            box-sizing: border-box;
        }
        h2 { 
            color: #7A2E35; 
            margin-bottom: 10px; 
            font-size: 1.4rem; 
        }
        .hint {
            color: #8D2B38; 
            font-size: 0.85rem; 
            margin-bottom: 25px;
            background: #F6EBDF; 
            padding: 8px 12px; 
            border-radius: 10px; 
            display: inline-block;
            font-weight: bold;
            border: 1px solid #F3B5A0;
        }
        input[type="password"] {
            width: 90%; 
            padding: 12px 15px; 
            border: 2px solid #F3B5A0;
            border-radius: 25px; 
            font-size: 1rem; 
            text-align: center; 
            outline: none; 
            transition: 0.3s;
            box-sizing: border-box; 
            background-color: #FFFFFF; 
            color: #7A2E35;
        }
        input[type="password"]:focus { 
            border-color: #FEA38E; 
            box-shadow: 0 0 8px rgba(254, 163, 142, 0.5); 
        }
        button {
            /* زر الدخول باللون المشمشي المائل للمرجاني */
            background-color: #FEA38E; 
            color: #FFFFFF; 
            border: none; 
            padding: 12px 30px;
            font-size: 1rem; 
            border-radius: 25px; 
            cursor: pointer; 
            margin-top: 20px; 
            transition: 0.3s; 
            width: 90%;
            font-weight: bold; 
            box-shadow: 0 4px 12px rgba(254, 163, 142, 0.4);
        }
        button:hover { 
            background-color: #FBA2AB; 
            transform: translateY(-2px);
        }
        .message { 
            margin-top: 15px; 
            font-size: 1rem; 
            font-weight: bold; 
            min-height: 24px; 
        }
        .error { 
            color: #B3261E; 
        }
        .success { 
            color: #7A2E35; 
        }

        @media (max-width: 360px) {
            h2 { font-size: 1.2rem; }
            button { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔒 I need a login password</h2>
        <div class="hint">💡 Hint: The feeling that brings two souls together.. 😉</div>
        <br>
        <input type="password" id="passwordInput" placeholder="....Write the password here in English">
        <br>
        <button onclick="checkPassword()">Log In</button>
        <div id="msg" class="message"></div>
    </div>

    <script>
        function checkPassword() {
            const password = document.getElementById("passwordInput").value;
            const msg = document.getElementById("msg");
            if (password === "love") 
            {
                msg.className = "message success";
                msg.innerText = "Let's go! 😍🎉";
                setTimeout(() => { window.location.href = "page2.html"; }, 1000);
            } else {
                msg.className = "message error";
                msg.innerText = " No, not that one 😢💔";
            }
        }
    </script>
</body>
</html>
